name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.17.0"
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: "0.76.1"
  GITLEAKS_VERSION: "8.30.1"
  AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  ci:
    name: fmt, validate, lint, test, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy and gitleaks
        run: |
          # Trivy v0.69.4 was a compromised release (GHSA-69fq-xp46-6x23, CVE-2026-33634).
          # Pinning the version is not enough. Cosign checks the checksum file, then
          # sha256sum checks the archive. gitleaks 8.30.1 publishes checksums and no
          # sigstore bundle, so its SHA-256 is pinned here.
          trivy_deb_sha=3350f4fac96ed099590c4a353bddb226f86311a0a2e7a8c626c162790d947f10
          gitleaks_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL -o /tmp/trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          curl -fsSL -o /tmp/trivy_checksums.txt.sigstore.json "${base}/trivy_${TRIVY_VERSION}_checksums.txt.sigstore.json"
          cosign verify-blob \
            --bundle /tmp/trivy_checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            /tmp/trivy_checksums.txt
          grep -F "${trivy_deb_sha}  trivy_${TRIVY_VERSION}_Linux-64bit.deb" /tmp/trivy_checksums.txt
          curl -fsSL -o /tmp/trivy.deb "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          echo "${trivy_deb_sha}  /tmp/trivy.deb" | sha256sum -c -
          sudo dpkg -i /tmp/trivy.deb
          gitleaks_base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o /tmp/gitleaks_checksums.txt "${gitleaks_base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "${gitleaks_sha}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt
          curl -fsSL -o /tmp/gitleaks.tar.gz "${gitleaks_base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${gitleaks_sha}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks

      - name: Quality gate
        run: make check

  plan-dev:
    name: Plan dev
    needs: ci
    if: vars.TF_PLAN_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: infrastructure/environments/dev
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}"
          test -n "${{ vars.TF_LOCK_TABLE }}"
          test -n "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          test -n "${TF_VAR_container_image}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/dev/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -compact-warnings -no-color

  apply-dev:
    name: Apply dev
    needs: plan-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: dev
    concurrency:
      group: apply-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan and apply
        working-directory: infrastructure/environments/dev
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
          TF_VAR_permissions_boundary_arn: ${{ vars.TF_PERMISSIONS_BOUNDARY_ARN }}
        run: |
          test -n "${TF_VAR_container_image}"
          test -n "${TF_VAR_permissions_boundary_arn}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/dev/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan -compact-warnings -no-color
          terraform apply -input=false -no-color tfplan

  plan-prod:
    name: Plan prod
    needs: ci
    if: vars.TF_APPLY_PROD_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: infrastructure/environments/prod
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE_PROD }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
        run: |
          test -n "${TF_VAR_container_image}"
          test -n "${TF_VAR_certificate_arn}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/prod/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -compact-warnings -no-color

  apply-prod:
    name: Apply prod
    needs: plan-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_APPLY_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: prod
    concurrency:
      group: apply-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan and apply
        working-directory: infrastructure/environments/prod
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE_PROD }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
          TF_VAR_permissions_boundary_arn: ${{ vars.TF_PERMISSIONS_BOUNDARY_ARN }}
        run: |
          test -n "${TF_VAR_container_image}"
          test -n "${TF_VAR_certificate_arn}"
          test -n "${TF_VAR_permissions_boundary_arn}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/prod/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan -compact-warnings -no-color
          terraform apply -input=false -no-color tfplan

  image-dev:
    name: Build and push dev image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy
        run: |
          trivy_deb_sha=3350f4fac96ed099590c4a353bddb226f86311a0a2e7a8c626c162790d947f10
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL -o /tmp/trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          curl -fsSL -o /tmp/trivy_checksums.txt.sigstore.json "${base}/trivy_${TRIVY_VERSION}_checksums.txt.sigstore.json"
          cosign verify-blob \
            --bundle /tmp/trivy_checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            /tmp/trivy_checksums.txt
          grep -F "${trivy_deb_sha}  trivy_${TRIVY_VERSION}_Linux-64bit.deb" /tmp/trivy_checksums.txt
          curl -fsSL -o /tmp/trivy.deb "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          echo "${trivy_deb_sha}  /tmp/trivy.deb" | sha256sum -c -
          sudo dpkg -i /tmp/trivy.deb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build, scan and push
        working-directory: apps/api
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/portfolio-dev:${GITHUB_SHA}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${registry}"
          docker build -t "${image}" .
          trivy image --severity HIGH,CRITICAL --exit-code 1 "${image}"
          docker push "${image}"
          echo "Set CONTAINER_IMAGE to ${image} before the next dev apply."
