name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.0"
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: "0.76.1"
  GITLEAKS_VERSION: "8.30.1"
  AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  ci:
    name: fmt, validate, lint, test, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install Trivy and gitleaks
        run: |
          curl -sSfL -o /tmp/trivy.deb "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Quality gate
        run: make check

  plan-dev:
    name: Plan dev
    needs: ci
    if: vars.TF_PLAN_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: infrastructure/environments/dev
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}"
          test -n "${{ vars.TF_LOCK_TABLE }}"
          test -n "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          test -n "${TF_VAR_container_image}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/dev/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan -no-color

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan
          retention-days: 1

  apply-dev:
    name: Apply dev
    needs: plan-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: dev
    concurrency:
      group: apply-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev

      - name: Apply saved plan
        working-directory: infrastructure/environments/dev
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/dev/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -input=false -no-color tfplan

  plan-prod:
    name: Plan prod
    needs: ci
    if: vars.TF_APPLY_PROD_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: infrastructure/environments/prod
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE_PROD }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
        run: |
          test -n "${TF_VAR_container_image}"
          test -n "${TF_VAR_certificate_arn}"
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/prod/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan -no-color

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod/tfplan
          retention-days: 1

  apply-prod:
    name: Apply prod
    needs: plan-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_APPLY_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: prod
    concurrency:
      group: apply-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod

      - name: Apply saved plan
        working-directory: infrastructure/environments/prod
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "environments/prod/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          kms_key_id     = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          EOF
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -input=false -no-color tfplan
