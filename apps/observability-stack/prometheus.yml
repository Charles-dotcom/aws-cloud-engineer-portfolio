global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Add your application targets here
  # Example for ECS / EC2 with node-exporter or cAdvisor
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Example for your Flask API (if you add /metrics endpoint with prometheus client)
  # - job_name: 'cloud-engineer-api'
  #   static_configs:
  #     - targets: ['api:8080']
